services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-crud}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"

  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: -n --log-file=stdout --lt-cred-mech --realm=${TURN_REALM:-clashinggrounds.local} --user=${TURN_USERNAME:-coturn}:${TURN_CREDENTIAL:-changeme}

  crud-server:
    build: ./crud-server
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-crud}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
    ports:
      - "${CRUD_SERVER_HOST_PORT:-5001}:5001"
    depends_on:
      - postgres
    volumes:
      - ./crud-server:/app

  game-server:
    build: ./game-server
    environment:
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      CRUD_SERVER_URL: http://crud-server:5001
      STUN_URL: ${STUN_URL:-stun:localhost:3478}
      TURN_URL: ${TURN_URL:-turn:localhost:3478}
      TURN_USERNAME: ${TURN_USERNAME:-coturn}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-changeme}
    ports:
      - "${GAME_SERVER_HOST_PORT:-5002}:5002"
    depends_on:
      - redis
      - crud-server
    volumes:
      - ./game-server:/app

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_CRUD_API_URL: ${NEXT_PUBLIC_CRUD_API_URL:-http://localhost:5001}
      NEXT_PUBLIC_GAME_API_URL: ${NEXT_PUBLIC_GAME_API_URL:-http://localhost:5002}
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    depends_on:
      - crud-server
      - game-server
    volumes:
      - ./frontend:/app
      # Anonymous volumes persist across `up` even after a rebuild, so a new
      # npm dependency won't show up here until you run:
      #   docker compose up -d --force-recreate --renew-anon-volumes frontend
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
